schema: spec-driven

context: |
  Stack: React 18 + TS strict + Vite 6 + Tailwind 4 + Radix UI + React Router 7 + React Query 5
  Backend: Node.js + Fastify 5 + Drizzle ORM + PostgreSQL (Monolito Modular)
  Deploy: Vercel (frontend + serverless API) + Supabase (PostgreSQL + Auth opcional)
  Architecture: 3-capas clásica. Frontend consume API REST con React Query. Backend monolito modular con 7 módulos (auth, admin, business, tracking, reports, surveys, client-portal). Auth JWT stateless con refresh token httpOnly. Permisos atómicos (sistema:* / negocio:*), sidebar dinámica desde API.
  Patrones: Layered Architecture, Monolito Modular, Bounded Contexts (Admin SPA ≠ Portal Cliente), Strangler Fig (migración desde Supabase directo), API-First, Server-Side Enforcement, Doble Auditoría (middleware + triggers).
  Testing: Vitest 3 + @testing-library/react + jsdom
  Style: ESLint 9 (ts+react) + Prettier + tsc --noEmit

strict_tdd: true

testing:
  ## Testing Capabilities
  **Strict TDD Mode**: enabled
  **Detected**: 2026-05-20

  ### Test Runner
  - Command: `vitest run` / `vitest`
  - Framework: vitest 3.1.1

  ### Test Layers
  | Layer | Available | Tool |
  |-------|-----------|------|
  | Unit | ✅ | vitest |
  | Integration | ✅ | @testing-library/react 16 + @testing-library/jest-dom 6 |
  | E2E | ❌ | — |

  ### Coverage
  - Available: ❌ (@vitest/coverage-* not installed; install @vitest/coverage-v8 to enable)
  - Command: `vitest --coverage`

  ### Quality Tools
  | Tool | Available | Command |
  |------|-----------|---------|
  | Linter | ✅ | `eslint . --ext .ts,.tsx` |
  | Type checker | ✅ | `tsc --noEmit` |
  | Formatter | ✅ | `prettier --check "src/**/*.{ts,tsx}"` |

  **Note**: Strict TDD Mode enabled — vitest + @testing-library/react detected.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Write tests before implementation (RED phase) when Strict TDD Mode is enabled
  verify:
    - Run `pnpm test:run` if test infrastructure exists
    - Compare implementation against every spec scenario
    - Run `pnpm typecheck` before final sign-off
  archive:
    - Warn before merging destructive deltas (large removals)
